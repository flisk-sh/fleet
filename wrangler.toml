name = "fleet"
main = "src/index.js"
compatibility_date = "2026-10-01"

# fleet.flisk.si on the flisk.si zone.
routes = [{ pattern = "fleet.flisk.si", custom_domain = true }]

# GitHub logins and fleet key hashes. Never a provider key.
# Create it once: `bunx wrangler@4 kv namespace create FLEET`, then put the printed id here.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
PUBLIC_ORIGIN = "https://fleet.flisk.si"

# Secrets (GitHub OAuth app with callback https://fleet.flisk.si/auth/callback):
#   bunx wrangler@4 secret put GITHUB_CLIENT_ID
#   bunx wrangler@4 secret put GITHUB_CLIENT_SECRET
