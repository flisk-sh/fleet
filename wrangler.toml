name = "fleet"
main = "src/index.js"
compatibility_date = "2026-10-01"

# fleet.flisk.si on the flisk.si zone.
routes = [{ pattern = "fleet.flisk.si", custom_domain = true }]

# Keys (hashes only) and pod facts. Never a provider key. Free plan: 100,000 rows written, 5 million read a day.
# Tables: `bunx wrangler@4 d1 execute fleet --remote --file schema.sql`
[[d1_databases]]
binding = "DB"
database_name = "fleet"
database_id = "ce277481-100d-43f5-8b96-f5fdb88218d4"

[vars]
PUBLIC_ORIGIN = "https://fleet.flisk.si"

# Secrets (GitHub OAuth app with callback https://fleet.flisk.si/auth/callback):
#   bunx wrangler@4 secret put GITHUB_CLIENT_ID
#   bunx wrangler@4 secret put GITHUB_CLIENT_SECRET
#   bunx wrangler@4 secret put SESSION_SECRET      any long random string; signs the cabinet's session cookie
#   bunx wrangler@4 secret put PROVIDER_KEYS_SECRET  at least 32 random characters; encrypts connected provider keys.
#                                                  Changing it makes every connected key unreadable (users reconnect).
#   bunx wrangler@4 secret put CHAT_SERVICE_SECRET  optional, 32+ random characters. Lets a trusted site (chat.flisk.si) call the API
#                                                  for a signed-in user (X-On-Behalf-Of) and connect provider keys for them. Anyone who has it
#                                                  can act as any login, so keep it a secret and unset where no trusted site exists.
